[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtaclip"
version = "0.1.0"
description = "Turn any long video into viral vertical clips with an LLM, yt-dlp and ffmpeg."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gtaclip = "clipper.cli:run"

[tool.setuptools]
packages = ["clipper"]
